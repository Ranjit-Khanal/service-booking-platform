# HAProxy load balancer — book Ch3 (Scaling / Reverse Proxies with HAProxy)
global
  log stdout format raw local0
  maxconn 256

defaults
  mode http
  log global
  option httplog
  option http-server-close
  timeout connect 5s
  timeout client 50s
  timeout server 50s
  timeout check 2s

frontend inbound
  bind *:8080
  default_backend slotbook_api
  # Back pressure: hard limit concurrent connections (Ch3 Rate Limiting and Back Pressure)
  maxconn 200

backend slotbook_api
  balance roundrobin
  option httpchk GET /api/health
  http-check expect status 200
  # Per-instance max connections for back pressure
  server api1 api1:3000 check inter 2s fall 3 rise 2 maxconn 50
  server api2 api2:3000 check inter 2s fall 3 rise 2 maxconn 50
  server api3 api3:3000 check inter 2s fall 3 rise 2 maxconn 50
